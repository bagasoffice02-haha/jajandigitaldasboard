<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unggah Bukti Transfer - Jajan Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', -apple-system, sans-serif; }
        body {
            background: #0b1329;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header { text-align: center; }
        .header h1 { font-size: 1.15rem; font-weight: 700; color: #38bdf8; }
        .header p { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

        .upload-area {
            border: 2px dashed rgba(56, 189, 248, 0.35);
            border-radius: 12px;
            padding: 1.25rem 1rem;
            text-align: center;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.5);
            transition: all 0.2s ease;
        }
        .upload-area:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.08); }
        .upload-text { font-size: 0.85rem; font-weight: 600; color: #f1f5f9; }
        .upload-subtext { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
        #fileInput { display: none; }

        .preview-container {
            display: none;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .preview-image {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            background: #090d16;
            display: block;
        }
        .remove-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary { background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%); color: white; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-copy { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; margin-top: 8px; }

        .result-box {
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .result-title { font-size: 0.95rem; font-weight: 700; color: #34d399; }
        .result-desc { font-size: 0.72rem; color: #94a3b8; margin: 4px 0 8px; }
        .link-box {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-family: monospace;
            color: #38bdf8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .toast {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Unggah Bukti Transfer</h1>
            <p>Jajan Digital Official</p>
        </div>

        <form id="uploadForm">
            <div class="upload-area" id="dropArea">
                <div class="upload-text">Pilih atau Tarik Foto Bukti</div>
                <div class="upload-subtext">Format: JPG, PNG, WEBP (Maksimal 10MB)</div>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
            </div>

            <div class="preview-container" id="previewContainer">
                <img src="" id="previewImg" class="preview-image" alt="Preview">
                <button type="button" class="remove-btn" id="btnRemove">✕</button>
            </div>

            <button type="submit" class="btn btn-primary" id="btnSubmit" style="margin-top: 10px;" disabled>Unggah Bukti Transfer</button>
        </form>

        <div class="result-box" id="resultBox">
            <div class="result-title">Unggah Berhasil</div>
            <div class="result-desc">Salin link di bawah dan tempelkan ke grup WhatsApp untuk verifikasi admin.</div>
            <div class="link-box" id="linkOutput">https://...</div>
            <button type="button" class="btn btn-copy" id="btnCopy">Salin Link Bukti</button>
        </div>
    </div>

    <div class="toast" id="toast">Link tersalin ke clipboard</div>

    <script>
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImg = document.getElementById('previewImg');
        const btnRemove = document.getElementById('btnRemove');
        const btnSubmit = document.getElementById('btnSubmit');
        const uploadForm = document.getElementById('uploadForm');
        const resultBox = document.getElementById('resultBox');
        const linkOutput = document.getElementById('linkOutput');
        const btnCopy = document.getElementById('btnCopy');
        const toast = document.getElementById('toast');

        let selectedFile = null;
        dropArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Pilih file gambar valid (JPG, PNG, WEBP).');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewContainer.style.display = 'block';
                dropArea.style.display = 'none';
                btnSubmit.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        btnRemove.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            previewContainer.style.display = 'none';
            dropArea.style.display = 'block';
            btnSubmit.disabled = true;
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!selectedFile) return;

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Mengunggah...';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/api/upload-bukti', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.success) {
                    uploadForm.style.display = 'none';
                    resultBox.style.display = 'block';
                    const fullUrl = window.location.origin + data.url;
                    linkOutput.textContent = fullUrl;
                } else {
                    alert('Gagal unggah: ' + (data.error || 'Kesalahan sistem.'));
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Unggah Bukti Transfer';
                }
            } catch (err) {
                alert('Gangguan koneksi: ' + err.message);
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Unggah Bukti Transfer';
            }
        });

        btnCopy.addEventListener('click', () => {
            navigator.clipboard.writeText(linkOutput.textContent).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        });
    </script>
</body>
</html>
